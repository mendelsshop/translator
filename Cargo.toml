[package]
name = "translator"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
clap = { version = "4.6.5", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
itertools = "0.15.0"
log = "0.4.29"
rangemap = { version = "1.7.1", features = [ "serde1"] }
ratatui = { version = "0.30.2", features = ["unstable-widget-ref"] }
ratatui-explorer = "0.3.0"
ratatui-textarea = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-lexpr = "0.1.3"
simple_file_logger = "0.4.2"
